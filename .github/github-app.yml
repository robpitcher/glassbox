scripts:
  - name: Setup
    command: pnpm install --frozen-lockfile
    triggers:
      - session.create
  - name: Develop
    command: pnpm dev --host 127.0.0.1
  - name: Typecheck
    command: pnpm typecheck
  - name: Build
    command: pnpm build
  - name: Preview build
    command: pnpm preview --host 127.0.0.1

server_ready_pattern: '(?i)Local:?\s+(https?://\S+)'
auto_open_in_browser: true
